buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// CMake clean reconfigures the native build and looks for codegen JNI folders
// that library clean tasks have already deleted. Disable that clean and remove
// the stale .cxx cache instead.
gradle.projectsEvaluated {
    rootProject.subprojects { subproject ->
        subproject.tasks.matching { task ->
            task.name.startsWith("externalNativeBuildClean")
        }.configureEach { task ->
            task.enabled = false
        }
        def clean = subproject.tasks.findByName("clean")
        if (clean != null) {
            def cxxDir = new File(subproject.projectDir, ".cxx")
            clean.doFirst {
                if (cxxDir.exists()) {
                    cxxDir.deleteDir()
                }
            }
        }
    }
}
